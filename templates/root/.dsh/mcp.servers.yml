servers:
  wiki-manager:
    transport: stdio
    command: node
    args: [".agents/run-wiki-manager.mcp.js"]
    toolCallTimeoutMs: 120000
    # Keep the agent usable while Docker Desktop is starting; the scoped bridge
    # retries and registers wiki tools when the daemon becomes reachable.
    failOnStartupError: false
    reconnect:
      enabled: true
      initialDelayMs: 5000
      maxAttempts: 5