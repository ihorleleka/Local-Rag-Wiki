# DeepSeek Harness profile bundle for Local-Rag-Wiki.
# The lifecycle plugin reads each agent's workspace .dsh/mcp.servers.yml and
# mounts its managed wiki bridge through agent.ctx. This is deliberately not a
# profile-global MCP client: one DSH profile can serve several repositories.
- insert:
    - id: local-rag-wiki-lifecycle
      name: '@ihorleleka/wiki-kit/dsh'
