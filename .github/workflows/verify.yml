name: Verify

on:
  workflow_dispatch:

jobs:
  wiki-kit-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npm run verify

  kb-service-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      # These tests fake optional/native dependencies; no models or services.
      - run: python -m unittest discover -s kb-service/tests -p 'test_*.py'

  wiki-kit-runner-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - name: Pull pinned MCP image
        shell: bash
        run: |
          image=$(node -p "require('./templates/root/.agents/wiki-manager-contract.js').DEFAULT_IMAGE")
          docker pull "$image"
      - name: Exercise Docker and MCP runner
        run: npm run verify:runner
