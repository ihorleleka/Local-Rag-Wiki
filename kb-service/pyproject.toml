[build-system]
requires = ["setuptools>=69", "setuptools-scm[toml]>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kb-service"
dynamic = ["version"]
description = "Repository-scoped MCP knowledge service"
requires-python = ">=3.11"
dependencies = [
  "chromadb==1.5.9",
  "fastapi==0.139.0",
  "python-frontmatter==1.3.0",
  "mcp==1.28.1",
  "sse-starlette==3.4.5",
  "torch==2.12.1+cpu",
  "sentence-transformers==5.6.0",
  "transformers==5.12.1",
  "uvicorn==0.49.0"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
fallback_version = "0.0.0"
local_scheme = "no-local-version"
tag_regex = "^(?:v)?(?P<version>\\d+\\.\\d+\\.\\d+)$"
