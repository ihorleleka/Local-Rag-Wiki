[build-system]
requires = ["setuptools>=69", "setuptools-scm[toml]>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kb-service"
dynamic = ["version"]
description = "Repository-scoped MCP knowledge service"
requires-python = ">=3.11"
dependencies = [
  "chromadb==1.5.9",
  "fastapi==0.141.1",
  "python-frontmatter==1.3.0",
  "fastmcp==3.4.7",
  "tokenizers==0.23.1",
  "uvicorn==0.52.4"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
fallback_version = "0.0.0"
local_scheme = "no-local-version"
tag_regex = "^(?:v)?(?P<version>\\d+\\.\\d+\\.\\d+)$"
